[tool.poetry]
name = "coursework_2"
version = "0.1.0"
description = "A project to integrate with hh.ru API and manage job vacancies"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.buildapi"

[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "E266", "E501", "W503"]